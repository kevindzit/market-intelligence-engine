name: News database tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  news-database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/market_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the test database driver
        run: python -m pip install psycopg2-binary==2.9.11
      - name: Test RSS and NewsAPI database writes
        run: python -m unittest discover -s tests -p "test_news_saves.py" -v
